name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  released-r:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: 3.5.3
            rng-version: 3.5.0
          - r: 3.6.3
            rng-version: 3.6.0
          - r: 4.0.5
            rng-version: 4.0.0
          - r: 4.6.1
            rng-version: 4.6.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Compare Rust with R ${{ matrix.r }}
        env:
          RNG_COMPAT_REQUIRE_R: "1"
          RNG_COMPAT_R_VERSION: ${{ matrix.rng-version }}
        run: cargo test --test live_r -- --nocapture
