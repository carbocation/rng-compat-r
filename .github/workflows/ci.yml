name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  deterministic-math:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rustflags: "-C target-feature=-avx,-avx2,-fma"
            label: x86-64 baseline
          - os: ubuntu-latest
            rustflags: "-C target-feature=+avx2,+fma"
            label: x86-64 AVX2 and FMA
          - os: macos-14
            rustflags: ""
            label: AArch64 macOS
    name: deterministic math (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare pinned bit patterns
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --test deterministic

  deterministic-math-avx512-build:
    name: deterministic math (x86-64 AVX-512 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned tests with AVX-512 and FMA enabled
        env:
          RUSTFLAGS: "-C target-feature=+avx512f,+fma"
        run: cargo test --test deterministic --no-run

  released-r:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: 3.5.3
            rng-version: 3.5.0
          - r: 3.6.3
            rng-version: 3.6.0
          - r: 4.0.5
            rng-version: 4.0.0
          - r: 4.6.1
            rng-version: 4.6.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Compare Rust with R ${{ matrix.r }}
        env:
          RNG_COMPAT_REQUIRE_R: "1"
          RNG_COMPAT_R_VERSION: ${{ matrix.rng-version }}
        run: cargo test --test live_r -- --nocapture
      - name: Compare pnorm and L'Ecuyer-CMRG with R 4.6.1
        if: matrix.rng-version == '4.6.0'
        env:
          RNG_COMPAT_REQUIRE_R: "1"
        run: cargo test --test live_r_extended -- --nocapture
